<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시계열 파형 생성 및 푸리에(FFT) 분석 인터랙티브 실습 도구</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b1120;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(51, 65, 85, 0.8);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --coral: #fb7185;
      --emerald: #34d399;
      --purple: #c084fc;
      --amber: #facc15;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(192, 132, 252, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 1280px;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 1280px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 960px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
      margin-bottom: 1.25rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Controls Form */
    .control-group {
      margin-bottom: 1rem;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .control-group label > span:first-child {
      display: inline-flex;
      align-items: baseline;
      gap: 0;
    }

    .control-group label .val {
      font-family: 'JetBrains Mono', monospace;
      color: var(--primary);
      font-weight: 600;
    }

    .input-row {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    input[type="range"] {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: #334155;
      accent-color: var(--primary);
      cursor: pointer;
    }

    input[type="number"] {
      width: 75px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      padding: 0.3rem 0.5rem;
      font-size: 0.88rem;
      text-align: right;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    .formula-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px dashed #334155;
      border-radius: 8px;
      padding: 0.75rem;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      color: var(--emerald);
      margin-bottom: 1rem;
    }

    /* Buttons */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }

    .btn-emerald {
      background: linear-gradient(135deg, #059669, #047857);
    }
    .btn-emerald:hover {
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.4);
    }

    .btn-purple {
      background: linear-gradient(135deg, #7e22ce, #6b21a8);
    }
    .btn-purple:hover {
      box-shadow: 0 4px 12px rgba(126, 34, 206, 0.4);
    }

    .btn-danger {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
    }
    .btn-danger:hover {
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
    }

    .btn-secondary {
      background: #334155;
      color: var(--text-main);
    }
    .btn-secondary:hover {
      background: #475569;
    }

    .btn-full {
      grid-column: 1 / -1;
    }

    /* Stash List */
    .stash-list {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
      padding-right: 0.2rem;
    }

    .stash-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s;
    }

    .stash-item:hover {
      background: rgba(51, 65, 85, 0.5);
    }

    .stash-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .stash-color-badge {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .stash-info {
      font-size: 0.82rem;
    }

    .stash-name {
      font-weight: 600;
      color: var(--text-main);
    }

    .stash-details {
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .stash-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    /* Main Chart Area */
    .chart-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .chart-box {
      position: relative;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }

    .chart-title {
      font-size: 1.05rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .chart-title-icon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    canvas {
      width: 100%;
      height: 260px;
      background: #070a13;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      display: block;
    }

    /* Legends */
    .legend-box {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 0.6rem;
      padding: 0.6rem 0.8rem;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 8px;
      font-size: 0.8rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .legend-color {
      width: 14px;
      height: 4px;
      border-radius: 2px;
    }

    sub {
      font-size: 0.78em;
      line-height: 0;
      position: relative;
      bottom: -0.15em;
      vertical-align: baseline;
    }

    /* Tabs Styling */
    .tab-nav {
      display: flex;
      background: rgba(15, 23, 42, 0.75);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
      margin-bottom: 1.2rem;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.55rem 0.2rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      text-align: center;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #0b1120;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.35);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Non-blocking Toast Notification System */
    .toast-container {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      pointer-events: none;
    }

    .toast {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--emerald);
      color: var(--text-main);
      padding: 0.75rem 1.2rem;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(52, 211, 153, 0.25);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      opacity: 0;
      transform: translateY(-12px) scale(0.95);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .toast.fade-out {
      opacity: 0;
      transform: translateY(-8px) scale(0.96);
    }

    .toast-warning {
      border-color: var(--amber);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(250, 204, 21, 0.25);
    }
  </style>
</head>
<body>

  <header>
    <h1>시계열 파형 생성 및 푸리에(FFT) 분석 인터랙티브 실습 도구</h1>
    <p>정현파 생성, 개별 파형 저장, 멀티파형 합성 및 FFT 진폭 스펙트럼 분석 도구</p>
  </header>

  <div class="app-container">

    <!-- Left Controls Panel -->
    <div class="left-panel">
      
      <div class="card">
        <!-- Tab Navigation Bar -->
        <div class="tab-nav">
          <button class="tab-btn active" data-tab="tab1">1. 정현파 변수</button>
          <button class="tab-btn" data-tab="tab2">2. 디지털 샘플링</button>
          <button class="tab-btn" data-tab="tab3">3. 임시 저장함 <span id="stashBadge" style="font-size:0.75rem; opacity:0.85;">(0)</span></button>
        </div>

        <!-- Tab 1: 정현파 변수 설정 -->
        <div class="tab-content active" id="tab1">
          <div class="card-title" style="margin-bottom:0.8rem;">
            <span>1. 정현파 변수 설정</span>
            <span style="font-size:0.75rem; color:var(--emerald);">● 실시간 반영</span>
          </div>

          <div class="formula-box" id="formulaDisplay">
            y(t) = 1.00 sin(2π · 1.00t + 0.0°)
          </div>

          <!-- Amplitude A -->
          <div class="control-group">
            <label><span>진폭 (Amplitude, A)</span></label>
            <div class="input-row">
              <input type="range" id="sliderA" min="0.1" max="5.0" step="0.05" value="1.0">
              <input type="number" id="numA" min="0.1" max="5.0" step="0.1" value="1.0">
            </div>
          </div>

          <!-- Frequency f -->
          <div class="control-group">
            <label><span>주파수 (Frequency, f) [Hz]</span></label>
            <div class="input-row">
              <input type="range" id="sliderFreq" min="0.2" max="15.0" step="0.1" value="1.0">
              <input type="number" id="numFreq" min="0.2" max="15.0" step="0.1" value="1.0">
            </div>
          </div>

          <!-- Period T (Auto-linked) -->
          <div class="control-group">
            <label><span>주기 (Period, T = 1/f) [s]</span></label>
            <div class="input-row">
              <input type="range" id="sliderPeriod" min="0.067" max="5.0" step="0.01" value="1.0">
              <input type="number" id="numPeriod" min="0.067" max="5.0" step="0.1" value="1.0">
            </div>
          </div>

          <!-- Phase phi -->
          <div class="control-group">
            <label><span>위상 (Phase, φ) [°]</span></label>
            <div class="input-row">
              <input type="range" id="sliderPhase" min="0" max="360" step="1" value="0">
              <input type="number" id="numPhase" min="0" max="360" step="0.1" value="0">
            </div>
          </div>

          <div class="btn-grid">
            <button class="btn btn-emerald" id="btnStash">💾 현재 파형 저장</button>
            <button class="btn btn-secondary" id="btnReset">🔄 화면/변수 리셋</button>
            <button class="btn btn-purple btn-full" id="btnFFTTab1">📊 FFT 분석 실행 (진폭 스펙트럼)</button>
          </div>
        </div>

        <!-- Tab 2: 디지털 샘플링 설정 -->
        <div class="tab-content" id="tab2">
          <div class="card-title" style="margin-bottom:0.8rem;">
            <span>2. 디지털 샘플링 설정</span>
            <span style="font-size:0.75rem; color:var(--amber);" id="samplingStatusBadge">● 미실행</span>
          </div>

          <!-- Sampling Frequency fs -->
          <div class="control-group">
            <label><span>샘플링 주파수 (Sampling Frequency, f<sub>s</sub>) [Hz]</span></label>
            <div class="input-row">
              <input type="range" id="sliderFs" min="0.5" max="50.0" step="0.1" value="10.0">
              <input type="number" id="numFs" min="0.5" max="50.0" step="0.1" value="10.0">
            </div>
          </div>

          <!-- Sampling Interval dt -->
          <div class="control-group">
            <label><span>샘플링 간격 (Sampling Interval, Δt = 1/f<sub>s</sub>) [s]</span></label>
            <div class="input-row">
              <input type="range" id="sliderDt" min="0.02" max="2.0" step="0.005" value="0.100">
              <input type="number" id="numDt" min="0.02" max="2.0" step="0.1" value="0.100">
            </div>
          </div>

          <!-- Start Time t_start -->
          <div class="control-group">
            <label><span>시작 시간 (Start Time, t<sub>start</sub>) [s]</span></label>
            <div class="input-row">
              <input type="range" id="sliderTStart" min="0.0" max="7.5" step="0.1" value="0.0">
              <input type="number" id="numTStart" min="0.0" max="7.5" step="0.1" value="0.0">
            </div>
          </div>

          <!-- Sample Duration T_len -->
          <div class="control-group">
            <label><span>샘플 길이 (Sample Duration, T<sub>len</sub>) [s]</span></label>
            <div class="input-row">
              <input type="range" id="sliderTLen" min="0.1" max="8.0" step="0.1" value="8.0">
              <input type="number" id="numTLen" min="0.1" max="8.0" step="0.1" value="8.0">
            </div>
          </div>

          <div class="btn-grid">
            <button class="btn btn-emerald btn-full" id="btnRunSampling">📍 신호 샘플하기 (샘플 점 추출)</button>
            <button class="btn btn-purple btn-full" id="btnFFTTab2">📊 FFT 분석 실행 (진폭 스펙트럼)</button>
            <button class="btn btn-purple" id="btnStashSampled">💾 샘플 파형 저장</button>
            <button class="btn btn-secondary" id="btnClearSampling">❌ 샘플링 해제</button>
          </div>
        </div>

        <!-- Tab 3: 임시 저장 파형 목록 -->
        <div class="tab-content" id="tab3">
          <div class="card-title" style="margin-bottom:0.8rem;">
            <span>3. 임시 저장 파형 목록</span>
            <span style="font-size:0.75rem; color:var(--text-muted);" id="stashCount">0개 저장됨</span>
          </div>

          <div class="stash-toolbar">
            <label style="cursor:pointer; display:flex; align-items:center; gap:0.4rem;">
              <input type="checkbox" id="chkSelectAll" checked> 전체 선택/해제
            </label>
          </div>

          <div class="stash-list" id="stashList">
            <!-- Stashed items rendered dynamically -->
          </div>

          <div class="btn-grid">
            <button class="btn btn-secondary" id="btnLoadSelected">📥 선택 파형 불러오기</button>
            <button class="btn btn-danger" id="btnDeleteSelected">🗑️ 선택 삭제</button>
            <button class="btn btn-purple btn-full" id="btnCombine">⚡ 선택 파형 합성하기</button>
            <button class="btn btn-emerald btn-full" id="btnSaveCombined">✨ 합성 파형 임시 저장함에 추가</button>
            <button class="btn btn-primary btn-full" id="btnFFT" style="background: linear-gradient(135deg, #0284c7, #0369a1);">📊 FFT 분석 실행 (진폭 스펙트럼)</button>
          </div>
        </div>
      </div>

    </div>

    <!-- Right Visualization Panel -->
    <div class="right-panel">
      <div class="chart-container">

        <div class="card chart-box">
          <div class="chart-header">
            <div class="chart-title">
              <div class="chart-title-icon" style="background:var(--primary);"></div>
              <span>시계열 파형 (Time Series Waveform)</span>
            </div>
            <div style="display:flex; align-items:center; gap:0.6rem;">
              <span style="font-size:0.8rem; color:var(--text-muted);" id="timeChartMode">단일 실시간 파형 모드</span>
              <button class="btn btn-secondary" id="btnResetHeader" style="padding:0.25rem 0.5rem; font-size:0.75rem;">🔄 실시간 모드 리셋</button>
            </div>
          </div>

          <canvas id="canvasTime"></canvas>
          <div class="legend-box" id="legendTime">
            <!-- Dynamic legends -->
          </div>
        </div>

        <!-- FFT Amplitude Spectrum Chart Card -->
        <div class="card chart-box">
          <div class="chart-header">
            <div class="chart-title">
              <div class="chart-title-icon" style="background:var(--coral);"></div>
              <span>푸리에 분석 진폭 스펙트럼 (FFT Amplitude Spectrum)</span>
            </div>
            <span style="font-size:0.8rem; color:var(--text-muted);" id="fftChartStatus">FFT 분석 대기 중</span>
          </div>

          <canvas id="canvasFFT"></canvas>
          <div class="legend-box" id="legendFFT">
            <!-- Dynamic FFT legends -->
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // Global Color Palette for Saved Waveforms
    const COLOR_PALETTE = [
      '#38bdf8', // Cyan
      '#fb7185', // Coral
      '#34d399', // Emerald
      '#c084fc', // Purple
      '#facc15', // Amber
      '#f97316', // Orange
      '#a855f7', // Violet
      '#06b6d4'  // Cyan-Dark
    ];

    // Dom Elements
    const sliderA = document.getElementById('sliderA');
    const numA = document.getElementById('numA');

    const sliderFreq = document.getElementById('sliderFreq');
    const numFreq = document.getElementById('numFreq');

    const sliderPeriod = document.getElementById('sliderPeriod');
    const numPeriod = document.getElementById('numPeriod');

    const sliderPhase = document.getElementById('sliderPhase');
    const numPhase = document.getElementById('numPhase');

    const formulaDisplay = document.getElementById('formulaDisplay');

    const btnStash = document.getElementById('btnStash');
    const btnReset = document.getElementById('btnReset');
    const btnResetHeader = document.getElementById('btnResetHeader');
    const stashList = document.getElementById('stashList');
    const stashCount = document.getElementById('stashCount');
    const chkSelectAll = document.getElementById('chkSelectAll');

    const btnLoadSelected = document.getElementById('btnLoadSelected');
    const btnDeleteSelected = document.getElementById('btnDeleteSelected');
    const btnCombine = document.getElementById('btnCombine');
    const btnSaveCombined = document.getElementById('btnSaveCombined');
    const btnFFT = document.getElementById('btnFFT');
    const btnFFTTab1 = document.getElementById('btnFFTTab1');
    const btnFFTTab2 = document.getElementById('btnFFTTab2');

    const sliderFs = document.getElementById('sliderFs');
    const numFs = document.getElementById('numFs');

    const sliderDt = document.getElementById('sliderDt');
    const numDt = document.getElementById('numDt');

    const sliderTStart = document.getElementById('sliderTStart');
    const numTStart = document.getElementById('numTStart');

    const sliderTLen = document.getElementById('sliderTLen');
    const numTLen = document.getElementById('numTLen');

    const btnRunSampling = document.getElementById('btnRunSampling');
    const btnStashSampled = document.getElementById('btnStashSampled');
    const btnClearSampling = document.getElementById('btnClearSampling');
    const samplingStatusBadge = document.getElementById('samplingStatusBadge');

    let isSamplingActive = false;
    let currentSampledData = null;

    const canvasTime = document.getElementById('canvasTime');
    const ctxTime = canvasTime.getContext('2d');
    const legendTime = document.getElementById('legendTime');
    const timeChartMode = document.getElementById('timeChartMode');

    const canvasFFT = document.getElementById('canvasFFT');
    const ctxFFT = canvasFFT.getContext('2d');
    const legendFFT = document.getElementById('legendFFT');
    const fftChartStatus = document.getElementById('fftChartStatus');

    // Data State
    let stashedWaves = []; // Array of { id, name, A, f, T, phase, color, checked }
    let activeLoadedWaves = []; // Currently loaded waves for plotting/FFT
    let isCombinedMode = false;
    let hasRunFFT = false;
    let nextWaveId = 1;

    // Time domain sampling constants
    const duration = 8.0; // 8 seconds default
    const fs = 256;       // Sampling frequency = 256 Hz
    const N = 2048;       // N = 8 * 256 = 2048 points (Power of 2 for FFT)

    function resizeCanvases() {
      [canvasTime, canvasFFT].forEach(c => {
        c.width = c.clientWidth * window.devicePixelRatio;
        c.height = c.clientHeight * window.devicePixelRatio;
      });
      drawAll();
    }
    window.addEventListener('resize', resizeCanvases);

    // Synchronize Parameter Inputs
    function updateFormula() {
      const A = parseFloat(sliderA.value) || 0;
      const f = parseFloat(sliderFreq.value) || 1;
      const phi = parseFloat(sliderPhase.value) || 0;
      formulaDisplay.textContent = `y(t) = ${A.toFixed(2)} sin(2π · ${f.toFixed(2)}t + ${phi}°)`;
    }

    function syncInputs() {
      const A = parseFloat(sliderA.value) || 1.0;
      numA.value = A.toFixed(2);

      const f = parseFloat(sliderFreq.value) || 1.0;
      numFreq.value = f.toFixed(2);

      const T = 1.0 / f;
      sliderPeriod.value = T.toFixed(3);
      numPeriod.value = T.toFixed(3);

      const phi = parseFloat(sliderPhase.value) || 0;
      numPhase.value = phi;

      updateFormula();
      drawAll();
    }

    function updateParamsFromFreq(newFreq, syncNumInput = true) {
      newFreq = Math.max(0.1, Math.min(15.0, newFreq));
      const newPeriod = 1.0 / newFreq;

      sliderFreq.value = newFreq;
      if (syncNumInput) numFreq.value = newFreq.toFixed(2);

      sliderPeriod.value = newPeriod.toFixed(3);
      numPeriod.value = newPeriod.toFixed(3);

      updateFormula();
      drawAll();
    }

    function updateParamsFromPeriod(newPeriod, syncNumInput = true) {
      newPeriod = Math.max(0.067, Math.min(5.0, newPeriod));
      const newFreq = 1.0 / newPeriod;

      sliderPeriod.value = newPeriod.toFixed(3);
      if (syncNumInput) numPeriod.value = newPeriod.toFixed(3);

      sliderFreq.value = newFreq.toFixed(2);
      numFreq.value = newFreq.toFixed(2);

      updateFormula();
      drawAll();
    }

    // Event Listeners for Sliders & Number Input Typing
    // Amplitude A
    sliderA.addEventListener('input', () => {
      const A = parseFloat(sliderA.value) || 1.0;
      numA.value = A.toFixed(2);
      updateFormula();
      drawAll();
    });

    numA.addEventListener('input', () => {
      const valStr = numA.value;
      if (valStr === '' || valStr === '.') return;
      const A = parseFloat(valStr);
      if (!isNaN(A)) {
        sliderA.value = A;
        updateFormula();
        drawAll();
      }
    });

    numA.addEventListener('blur', () => {
      let A = parseFloat(numA.value);
      if (isNaN(A)) A = 1.0;
      A = Math.max(0.1, Math.min(5.0, A));
      numA.value = A.toFixed(2);
      sliderA.value = A;
      updateFormula();
      drawAll();
    });

    // Frequency f
    sliderFreq.addEventListener('input', () => {
      updateParamsFromFreq(parseFloat(sliderFreq.value), true);
    });

    numFreq.addEventListener('input', () => {
      const valStr = numFreq.value;
      if (valStr === '' || valStr === '.') return;
      const f = parseFloat(valStr);
      if (!isNaN(f) && f > 0) {
        updateParamsFromFreq(f, false);
      }
    });

    numFreq.addEventListener('blur', () => {
      let f = parseFloat(numFreq.value);
      if (isNaN(f)) f = 1.0;
      f = Math.max(0.1, Math.min(15.0, f));
      updateParamsFromFreq(f, true);
    });

    // Period T
    sliderPeriod.addEventListener('input', () => {
      updateParamsFromPeriod(parseFloat(sliderPeriod.value), true);
    });

    numPeriod.addEventListener('input', () => {
      const valStr = numPeriod.value;
      if (valStr === '' || valStr === '.') return;
      const T = parseFloat(valStr);
      if (!isNaN(T) && T > 0) {
        updateParamsFromPeriod(T, false);
      }
    });

    numPeriod.addEventListener('blur', () => {
      let T = parseFloat(numPeriod.value);
      if (isNaN(T)) T = 1.0;
      T = Math.max(0.067, Math.min(5.0, T));
      updateParamsFromPeriod(T, true);
    });

    sliderPhase.addEventListener('input', () => {

      numPhase.value = phi;
      updateFormula();

    numPhase.addEventListener('input', () => {

      const phi = parseFloat(valStr);

      sliderPhase.value = phi;
      updateFormula();

    // Card 2 Sampling Handlers
    function syncFsLabels(fsVal, syncDtInputs = true, syncSelfInput = true) {
      fsVal = Math.max(0.1, Math.min(50.0, fsVal));
      const dtVal = 1.0 / fsVal;

      }

      if (syncDtInputs) {
        sliderDt.value = dtVal.toFixed(3);
        numDt.value = dtVal.toFixed(3);
      }
    }

    function syncDtLabels(dtVal, syncFsInputs = true, syncSelfInput = true) {
      dtVal = Math.max(0.02, Math.min(2.0, dtVal));
      const fsVal = 1.0 / dtVal;

      sliderDt.value = dtVal.toFixed(3);
      if (syncSelfInput) {
        numDt.value = dtVal.toFixed(3);
      }

      if (syncFsInputs) {
        sliderFs.value = fsVal.toFixed(1);
        numFs.value = fsVal.toFixed(1);
      }
    }

    sliderFs.addEventListener('input', () => {
      syncFsLabels(parseFloat(sliderFs.value), true, true);
    });
    numFs.addEventListener('input', () => {
      const valStr = numFs.value;
      if (valStr === '' || valStr.endsWith('.')) return;
      const fs = parseFloat(valStr);
      if (!isNaN(fs) && fs > 0) syncFsLabels(fs, true, false);
    });
    numFs.addEventListener('blur', () => {
      let fs = parseFloat(numFs.value);
      if (isNaN(fs)) fs = 10.0;
      syncFsLabels(fs, true, true);
    });

    sliderDt.addEventListener('input', () => {
      syncDtLabels(parseFloat(sliderDt.value), true, true);
    });
    numDt.addEventListener('input', () => {
      const valStr = numDt.value;
      if (valStr === '' || valStr.endsWith('.')) return;
      const dt = parseFloat(valStr);
      if (!isNaN(dt) && dt > 0) syncDtLabels(dt, true, false);
    });
    numDt.addEventListener('blur', () => {
      let dt = parseFloat(numDt.value);
      if (isNaN(dt)) dt = 0.1;
      syncDtLabels(dt, true, true);
    });

    function syncTStartLabels(tVal) {
      tVal = Math.max(0.0, Math.min(7.5, tVal));

      numTStart.value = tVal.toFixed(1);

    sliderTStart.addEventListener('input', () => {

    numTStart.addEventListener('input', () => {

        syncTStartLabels(t);
        drawAll();
      }
    });
    numTStart.addEventListener('blur', () => {
      let t = parseFloat(numTStart.value);
      if (isNaN(t)) t = 0.0;

      drawAll();
    });

    function syncTLenLabels(tVal) {
      tVal = Math.max(0.1, Math.min(8.0, tVal));

    sliderTLen.addEventListener('input', () => {

    numTLen.addEventListener('input', () => {
      const valStr = numTLen.value;
      if (valStr === '' || valStr === '.') return;
      const t = parseFloat(valStr);
      if (!isNaN(t)) {
        syncTLenLabels(t);
        drawAll();
      }
    });
    numTLen.addEventListener('blur', () => {
      let t = parseFloat(numTLen.value);
      if (isNaN(t)) t = 8.0;
      syncTLenLabels(t);
      drawAll();
    });

    // Time Window Interactive Drag-and-Drop on Canvas Time
    let isDraggingTimeWin = false;
    let dragTarget = null; // 'left', 'right', 'window'
    let dragInitialX = 0;
    let dragInitialTStart = 0;
    let dragInitialTLen = 8.0;
    let dragInitialTEnd = 8.0;

    function getCanvasCoords(e) {
      const rect = canvasTime.getBoundingClientRect();
      let clientX = e.clientX;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
      }
      const scaleX = canvasTime.width / rect.width;
      const x = (clientX - rect.left) * scaleX;
      return { x, clientX };
    }

    function getTimeWinPixelCoords() {
      const marginL = 55 * window.devicePixelRatio;
      const marginR = 30 * window.devicePixelRatio;
      const plotW = canvasTime.width - marginL - marginR;

      const tStartVal = parseFloat(sliderTStart.value) || 0.0;
      const tLenVal = parseFloat(sliderTLen.value) || 8.0;
      const tEndVal = Math.min(duration, tStartVal + tLenVal);

      const xLeft = marginL + (tStartVal / duration) * plotW;
      const xRight = marginL + (tEndVal / duration) * plotW;

      return { xLeft, xRight, marginL, plotW, duration };
    }

    function checkHandleHover(e) {
      if (isDraggingTimeWin) return;
      const { x } = getCanvasCoords(e);
      const { xLeft, xRight } = getTimeWinPixelCoords();
      const tol = 20 * window.devicePixelRatio;

      if (Math.abs(x - xLeft) <= tol || Math.abs(x - xRight) <= tol) {
        canvasTime.style.cursor = 'ew-resize';
      } else if (x > xLeft && x < xRight) {
        canvasTime.style.cursor = 'grab';
      } else {
        canvasTime.style.cursor = 'default';
      }
    }

    canvasTime.addEventListener('mousemove', checkHandleHover);

    function startDragTimeWin(e) {
      const { x, clientX } = getCanvasCoords(e);
      const { xLeft, xRight } = getTimeWinPixelCoords();
      const tol = 22 * window.devicePixelRatio;

      dragInitialX = clientX;
      dragInitialTStart = parseFloat(sliderTStart.value) || 0.0;
      dragInitialTLen = parseFloat(sliderTLen.value) || 8.0;
      dragInitialTEnd = Math.min(duration, dragInitialTStart + dragInitialTLen);

      if (Math.abs(x - xLeft) <= tol) {
        isDraggingTimeWin = true;
        dragTarget = 'left';
        canvasTime.style.cursor = 'ew-resize';
        e.preventDefault();
      } else if (Math.abs(x - xRight) <= tol) {
        isDraggingTimeWin = true;
        dragTarget = 'right';
        canvasTime.style.cursor = 'ew-resize';
        e.preventDefault();
      } else if (x > xLeft && x < xRight) {
        isDraggingTimeWin = true;
        dragTarget = 'window';
        canvasTime.style.cursor = 'grabbing';
        e.preventDefault();
      }
    }

    function doDragTimeWin(e) {
      if (!isDraggingTimeWin || !dragTarget) return;
      const rect = canvasTime.getBoundingClientRect();
      const marginL = 55 * window.devicePixelRatio;
      const marginR = 30 * window.devicePixelRatio;
      const plotW = canvasTime.width - marginL - marginR;

      let clientX = e.clientX;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
      }
      const scaleX = canvasTime.width / rect.width;
      const currentCanvasX = (clientX - rect.left) * scaleX;

      const tCurr = Math.max(0.0, Math.min(duration, ((currentCanvasX - marginL) / plotW) * duration));

      if (dragTarget === 'left') {
        const t1 = tCurr;
        const t2 = dragInitialTEnd;
        const newStart = Math.min(t1, t2);
        const newEnd = Math.max(t1, t2);
        const newLen = Math.max(0.1, newEnd - newStart);

        syncTStartLabels(newStart);
        syncTLenLabels(newLen);
      } else if (dragTarget === 'right') {
        const t1 = dragInitialTStart;
        const t2 = tCurr;
        const newStart = Math.min(t1, t2);
        const newEnd = Math.max(t1, t2);
        const newLen = Math.max(0.1, newEnd - newStart);

        syncTStartLabels(newStart);
        syncTLenLabels(newLen);
      } else if (dragTarget === 'window') {
        const deltaX = (clientX - dragInitialX) * scaleX;
        const deltaT = (deltaX / plotW) * duration;

        let newStart = dragInitialTStart + deltaT;
        newStart = Math.max(0.0, Math.min(duration - dragInitialTLen, newStart));

        syncTStartLabels(newStart);
        syncTLenLabels(dragInitialTLen);
      }

      drawAll();
    }

    function stopDragTimeWin() {
      if (isDraggingTimeWin) {
        isDraggingTimeWin = false;
        dragTarget = null;
        canvasTime.style.cursor = 'default';
        drawAll();
      }
    }

    canvasTime.addEventListener('mousedown', startDragTimeWin);
    window.addEventListener('mousemove', doDragTimeWin);
    window.addEventListener('mouseup', stopDragTimeWin);

    canvasTime.addEventListener('touchstart', startDragTimeWin, { passive: false });
    window.addEventListener('touchmove', doDragTimeWin, { passive: false });
    window.addEventListener('touchend', stopDragTimeWin);

    function getActiveContinuousVal(tVal) {
      if (activeLoadedWaves.length === 0) {
        const A = parseFloat(sliderA.value) || 1.0;
        const f = parseFloat(sliderFreq.value) || 1.0;
        const phiRad = ((parseFloat(sliderPhase.value) || 0) * Math.PI) / 180.0;
        return A * Math.sin(2 * Math.PI * f * tVal + phiRad);
      } else if (!isCombinedMode) {
        return getWaveVal(activeLoadedWaves[0], tVal);
      } else {
        let sum = 0;
        activeLoadedWaves.forEach(w => {
          sum += getWaveVal(w, tVal);
        });
        return sum;
      }
    }

    btnRunSampling.addEventListener('click', () => {
      // Time domain sampling constants
      const duration = 8.0; // 8 seconds default
      const fs = 256;       // Sampling frequency = 256 Hz
      const N = 2048;       // N = 8 * 256 = 2048 points (Power of 2 for FFT)

      const fsVal = parseFloat(numFs.value) || parseFloat(sliderFs.value) || 10.0;
      const tStartVal = parseFloat(sliderTStart.value) || 0.0;
      const tLenVal = parseFloat(sliderTLen.value) || 8.0;

      const dt = 1.0 / fsVal;
      const times = [];
      const values = [];

      const tEnd = Math.min(8.0, tStartVal + tLenVal);
      for (let t = tStartVal; t <= tEnd + 1e-9; t += dt) {
        times.push(t);
        values.push(getActiveContinuousVal(t));
      }

      currentSampledData = {
        fs: fsVal,
        dt: dt,
        tStart: tStartVal,
        tLen: tLenVal,
        times: times,
        values: values
      };

      isSamplingActive = true;
      samplingStatusBadge.textContent = `● 샘플링 완료 (${times.length}개 점)`;
      samplingStatusBadge.style.color = 'var(--emerald)';
      hasRunFFT = true;
      fftChartStatus.textContent = 'FFT 분석 완료';

      drawAll();
    });

    btnClearSampling.addEventListener('click', () => {
      isSamplingActive = false;
      currentSampledData = null;
      samplingStatusBadge.textContent = '● 미실행';
      samplingStatusBadge.style.color = 'var(--amber)';
      drawAll();
    });

    // Non-blocking Toast Notification Helper
    function showToast(message, type = 'success') {
      let container = document.getElementById('toastContainer');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        container.className = 'toast-container';
        document.body.appendChild(container);
      }

      const toast = document.createElement('div');
      toast.className = 'toast';
      if (type === 'warning') toast.classList.add('toast-warning');
      toast.innerHTML = `<span>${message}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.add('show');
      });

      setTimeout(() => {
        toast.classList.remove('show');
        toast.classList.add('fade-out');
        setTimeout(() => {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 350);
      }, 1600);
    }

    btnStashSampled.addEventListener('click', () => {
      if (!isSamplingActive || !currentSampledData || currentSampledData.times.length === 0) {
        showToast('먼저 "신호 샘플하기" 버튼을 눌러 샘플링을 수행해주세요.', 'warning');
        return;
      }

      const color = COLOR_PALETTE[stashedWaves.length % COLOR_PALETTE.length];
      const sampledWave = {
        id: nextWaveId++,
        name: `샘플파형 #${nextWaveId - 1} (${currentSampledData.fs.toFixed(1)}Hz)`,
        isSampled: true,
        fs: currentSampledData.fs,
        dt: currentSampledData.dt,
        tStart: currentSampledData.tStart,
        tLen: currentSampledData.tLen,
        sampleTimes: [...currentSampledData.times],
        sampleValues: [...currentSampledData.values],
        color: color,
        checked: true
      };

      stashedWaves.push(sampledWave);
      renderStashList();
      showToast(`💾 ${sampledWave.name}가 임시 저장함에 추가되었습니다.`);
    });

    // Helper to evaluate waveform value at time t
    function getWaveVal(wave, tVal) {
      if (wave.isSampled) {
        const times = wave.sampleTimes;
        const vals = wave.sampleValues;
        if (!times || times.length === 0) return 0;
        const eps = 1e-6;
        if (tVal < times[0] - eps || tVal > times[times.length - 1] + eps) return 0;
        if (tVal <= times[0]) return vals[0];
        if (tVal >= times[times.length - 1]) return vals[vals.length - 1];

        // Binary search for exact interval
        let low = 0, high = times.length - 1;
        while (low <= high) {
          let mid = (low + high) >> 1;
          if (times[mid] <= tVal) {
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }
        let idx = Math.max(0, high);
        if (idx >= times.length - 1) idx = times.length - 2;
        const t0 = times[idx], t1 = times[idx + 1];
        const v0 = vals[idx], v1 = vals[idx + 1];
        const dtSeg = t1 - t0;
        if (Math.abs(dtSeg) < 1e-12) return v0;
        const ratio = (tVal - t0) / dtSeg;
        return v0 + ratio * (v1 - v0);
      } else if (wave.isComposite) {
        let sum = 0;
        wave.components.forEach(c => {
          const phiRad = (c.phi * Math.PI) / 180.0;
          sum += c.A * Math.sin(2 * Math.PI * c.f * tVal + phiRad);
        });
        return sum;
      } else {
        const phiRad = (wave.phi * Math.PI) / 180.0;
        return wave.A * Math.sin(2 * Math.PI * wave.f * tVal + phiRad);
      }
    }

    // Stash Management
    btnStash.addEventListener('click', () => {
      const A = parseFloat(sliderA.value);
      const f = parseFloat(sliderFreq.value);
      const T = 1.0 / f;
      const phi = parseFloat(sliderPhase.value);
      const color = COLOR_PALETTE[(stashedWaves.length) % COLOR_PALETTE.length];

      const wave = {
        id: nextWaveId++,
        name: `파형 #${nextWaveId - 1}`,
        A: A,
        f: f,
        T: T,
        phi: phi,
        color: color,
        checked: true
      };

      stashedWaves.push(wave);
      renderStashList();
      showToast(`💾 ${wave.name}이 임시 저장함에 추가되었습니다.`);
    });

    btnSaveCombined.addEventListener('click', () => {
      const checkedWaves = stashedWaves.filter(w => w.checked);
      const targets = (checkedWaves.length > 0) ? checkedWaves : activeLoadedWaves;

      if (targets.length === 0) {
        showToast('합성 파형으로 저장할 구성 파형들을 임시 목록에서 선택(체크)해주세요.', 'warning');
        return;
      }

      const components = [];
      const componentNames = [];
      targets.forEach(w => {
        if (w.isComposite) {
          components.push(...w.components);
          if (w.componentNames && w.componentNames.length > 0) {
            componentNames.push(...w.componentNames);
          } else {
            componentNames.push(w.name);
          }
        } else {
          components.push({ A: w.A, f: w.f, phi: w.phi });
          componentNames.push(w.name || `f=${w.f.toFixed(1)}Hz`);
        }
      });

      const color = COLOR_PALETTE[stashedWaves.length % COLOR_PALETTE.length];
      const combinedWave = {
        id: nextWaveId++,
        name: `합성 파형 #${nextWaveId - 1}`,
        isComposite: true,
        components: components,
        componentNames: componentNames,
        color: color,
        checked: true
      };

      stashedWaves.push(combinedWave);
      renderStashList();
      showToast(`✨ ${combinedWave.name}가 임시 저장함에 추가되었습니다.`);
    });

    function resetToLiveMode() {
      activeLoadedWaves = [];
      isCombinedMode = false;
      hasRunFFT = false;

      isSamplingActive = false;
      currentSampledData = null;
      samplingStatusBadge.textContent = '● 미실행';
      samplingStatusBadge.style.color = 'var(--amber)';

      sliderA.value = 1.0;
      sliderFreq.value = 1.0;
      updateParamsFromFreq(1.0);
      sliderPhase.value = 0;

      sliderTStart.value = 0.0;
      numTStart.value = '0.0';
      sliderTLen.value = 8.0;
      numTLen.value = '8.0';

      timeChartMode.textContent = '단일 실시간 파형 모드';
      fftChartStatus.textContent = 'FFT 분석 대기 중';

      syncInputs();

    function runFFTAnalysis() {

    if (btnFFTTab1) btnFFTTab1.addEventListener('click', runFFTAnalysis);
    if (btnFFTTab2) btnFFTTab2.addEventListener('click', runFFTAnalysis);
    if (btnFFT) btnFFT.addEventListener('click', runFFTAnalysis);

    // Pure JS Cooley-Tukey Radix-2 FFT Engine
    function runFFT(signalValues) {
      const len = signalValues.length;
      const re = new Float64Array(signalValues);
      const im = new Float64Array(len);

      // Bit reversal
      let j = 0;
      for (let i = 0; i < len - 1; i++) {
        if (i < j) {
          const tempR = re[i]; re[i] = re[j]; re[j] = tempR;
          const tempI = im[i]; im[i] = im[j]; im[j] = tempI;
        }
        let k = len >> 1;
        while (k <= j) {
          j -= k;
          k >>= 1;
        }
        j += k;
      }

      // Computation
      for (let l = 2; l <= len; l <<= 1) {
        const halfLen = l >> 1;
        const angle = -2 * Math.PI / l;
        const wStepR = Math.cos(angle);
        const wStepI = Math.sin(angle);
        for (let i = 0; i < len; i += l) {
          let wR = 1, wI = 0;
          for (let k = 0; k < halfLen; k++) {
            const posE = i + k;
            const posO = i + k + halfLen;
            const uR = re[posE], uI = im[posE];
            const vR = re[posO] * wR - im[posO] * wI;
            const vI = re[posO] * wI + im[posO] * wR;
            re[posE] = uR + vR; im[posE] = uI + vI;
            re[posO] = uR - vR; im[posO] = uI - vI;
            const nextWR = wR * wStepR - wI * wStepI;
            const nextWI = wR * wStepI + wI * wStepR;
            wR = nextWR; wI = nextWI;
          }
        }
      }

      // Magnitude Spectrum (0 ~ fs/2)
      const halfN = len >> 1;
      const amps = new Float64Array(halfN);
      for (let i = 0; i < halfN; i++) {
        const mag = Math.sqrt(re[i] * re[i] + im[i] * im[i]);
        amps[i] = (i === 0) ? (mag / len) : (2.0 * mag / len);
      }
      return amps;
    }

    function computeSampledFFT(sampleValues, fsVal) {
      const M = sampleValues.length;
      if (!M || M < 2) return { freqs: new Float64Array(0), amps: new Float64Array(0) };

      let Nfft = 1;
      while (Nfft < M) Nfft <<= 1;
      Nfft = Math.max(64, Nfft);

      const signalVals = new Float64Array(Nfft);
      for (let i = 0; i < M; i++) {
        signalVals[i] = sampleValues[i];
      }

      const spectrum = runFFT(signalVals);
      const halfN = Nfft >> 1;
      const freqs = new Float64Array(halfN);
      const amps = new Float64Array(halfN);

      for (let i = 0; i < halfN; i++) {
        freqs[i] = (i / Nfft) * fsVal;
        amps[i] = spectrum[i] * (Nfft / M);
      }
      return { freqs, amps, Nfft, M, fs: fsVal };
    }

    // Main Drawing Function
    function drawAll() {
      drawTimeDomain();
      drawFFTDomain();
    }

    function drawTimeDomain() {
      const w = canvasTime.width;
      const h = canvasTime.height;
      const ctx = ctxTime;

      ctx.clearRect(0, 0, w, h);

      const marginL = 55 * window.devicePixelRatio;
      const marginR = 30 * window.devicePixelRatio;
      const marginT = 30 * window.devicePixelRatio;
      const marginB = 45 * window.devicePixelRatio;

      const plotW = w - marginL - marginR;
      const plotH = h - marginT - marginB;
      const centerY = marginT + plotH / 2;

      // Draw Grid & Axes
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1 * window.devicePixelRatio;

      // Horizontal reference y = 0
      ctx.beginPath();
      ctx.moveTo(marginL, centerY);
      ctx.lineTo(w - marginR, centerY);
      ctx.stroke();

      // Axis Box / Spines
      ctx.strokeStyle = '#334155';
      ctx.strokeRect(marginL, marginT, plotW, plotH);

      // Ticks & Labels
      ctx.fillStyle = '#94a3b8';
      ctx.font = `${11 * window.devicePixelRatio}px Inter`;
      ctx.textAlign = 'center';

      // X-axis ticks (Time 0 ~ 8s)
      for (let sec = 0; sec <= 8; sec++) {
        const px = marginL + (sec / 8.0) * plotW;
        ctx.beginPath();
        ctx.moveTo(px, marginT + plotH);
        ctx.lineTo(px, marginT + plotH + 5 * window.devicePixelRatio);
        ctx.stroke();
        ctx.fillText(`${sec}s`, px, marginT + plotH + 20 * window.devicePixelRatio);
      }

      // Y-axis ticks (-5 ~ +5)
      const maxRangeY = 5.0;
      ctx.textAlign = 'right';
      for (let yVal = -4; yVal <= 4; yVal += 2) {
        const py = centerY - (yVal / maxRangeY) * (plotH / 2);
        ctx.beginPath();
        ctx.moveTo(marginL - 5 * window.devicePixelRatio, py);
        ctx.lineTo(marginL, py);
        ctx.stroke();
        ctx.fillText(yVal.toFixed(1), marginL - 8 * window.devicePixelRatio, py + 4 * window.devicePixelRatio);
      }

      ctx.fillText('Time (s)', w - marginR, marginT + plotH + 35 * window.devicePixelRatio);
      ctx.fillText('Amplitude', marginL - 10 * window.devicePixelRatio, marginT - 12 * window.devicePixelRatio);

      // Draw Time Window Shading Highlight & Handle Grips
      const tStartVal = parseFloat(sliderTStart.value) || 0.0;
      const tLenVal = parseFloat(sliderTLen.value) || 4.0;
      const tEndVal = Math.min(duration, tStartVal + tLenVal);

      const xWinLeft = marginL + (tStartVal / duration) * plotW;
      const xWinRight = marginL + (tEndVal / duration) * plotW;

      // 1. Light Shaded Area
      ctx.fillStyle = 'rgba(56, 189, 248, 0.14)';
      ctx.fillRect(xWinLeft, marginT, xWinRight - xWinLeft, plotH);

      // 2. Boundary lines
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
      ctx.lineWidth = 1.5 * window.devicePixelRatio;

      ctx.beginPath();
      ctx.moveTo(xWinLeft, marginT);
      ctx.lineTo(xWinLeft, marginT + plotH);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(xWinRight, marginT);
      ctx.lineTo(xWinRight, marginT + plotH);
      ctx.stroke();

      // 3. Handle Grips (Pill icons)
      const handleW = 6 * window.devicePixelRatio;
      const handleH = 24 * window.devicePixelRatio;

      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(xWinLeft - handleW / 2, centerY - handleH / 2, handleW, handleH);
      ctx.fillRect(xWinRight - handleW / 2, centerY - handleH / 2, handleW, handleH);

      // Determine which waves to plot
      legendTime.innerHTML = '';

      if (activeLoadedWaves.length === 0) {
        // Live Single Wave Mode
        timeChartMode.textContent = '단일 실시간 파형 모드';

        const A = parseFloat(sliderA.value);
        const f = parseFloat(sliderFreq.value);
        const phiRad = (parseFloat(sliderPhase.value) * Math.PI) / 180.0;

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5 * window.devicePixelRatio;
        ctx.beginPath();

        for (let i = 0; i < N; i++) {
          const tVal = (i / N) * duration;
          const yVal = A * Math.sin(2 * Math.PI * f * tVal + phiRad);
          const px = marginL + (tVal / duration) * plotW;
          const py = centerY - (yVal / maxRangeY) * (plotH / 2);

          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        legendTime.innerHTML = `
          <div class="legend-item">
            <div class="legend-color" style="background:#38bdf8;"></div>
            <span>실시간 파형 (A=${A.toFixed(2)}, f=${f.toFixed(2)}Hz)</span>
          </div>
        `;
      } else if (!isCombinedMode) {
        // Multi-wave Loaded Mode (Plot each separately)
        activeLoadedWaves.forEach(wave => {
          ctx.strokeStyle = wave.color;
          ctx.lineWidth = 2 * window.devicePixelRatio;

          if (wave.isSampled && wave.sampleTimes && wave.sampleTimes.length > 0) {
            const times = wave.sampleTimes;
            const vals = wave.sampleValues;

            ctx.beginPath();
            for (let k = 0; k < times.length; k++) {
              const tVal = times[k];
              const yVal = vals[k];
              const px = marginL + (tVal / duration) * plotW;
              const py = centerY - (yVal / maxRangeY) * (plotH / 2);

              if (k === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.stroke();

            // Draw solid sample dots for loaded sampled wave
            for (let k = 0; k < times.length; k++) {
              const tVal = times[k];
              const yVal = vals[k];
              const px = marginL + (tVal / duration) * plotW;
              const py = centerY - (yVal / maxRangeY) * (plotH / 2);

              ctx.fillStyle = wave.color;
              ctx.beginPath();
              ctx.arc(px, py, 3.5 * window.devicePixelRatio, 0, 2 * Math.PI);
              ctx.fill();
            }
          } else {
            ctx.beginPath();
            for (let i = 0; i < N; i++) {
              const tVal = (i / N) * duration;
              const yVal = getWaveVal(wave, tVal);
              const px = marginL + (tVal / duration) * plotW;
              const py = centerY - (yVal / maxRangeY) * (plotH / 2);

              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.stroke();
          }

          const compStr = wave.componentNames ? wave.componentNames.join(', ') : (wave.components ? wave.components.map(c => `f=${c.f.toFixed(1)}Hz`).join(', ') : '');
          const labelStr = wave.isSampled
            ? `${wave.name} (fs=${wave.fs.toFixed(1)}Hz, N=${wave.sampleTimes.length}개)`
            : (wave.isComposite
              ? `${wave.name} (${compStr})`
              : `${wave.name} (A=${wave.A.toFixed(2)}, f=${wave.f.toFixed(2)}Hz)`);

          legendTime.innerHTML += `
            <div class="legend-item">
              <div class="legend-color" style="background:${wave.color};"></div>
              <span>${labelStr}</span>
            </div>
          `;
        });
      } else {
        // Combined Summation Mode
        // Draw individual thin background waves
        activeLoadedWaves.forEach(wave => {
          ctx.strokeStyle = wave.color;
          ctx.lineWidth = 1 * window.devicePixelRatio;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();

          for (let i = 0; i < N; i++) {
            const tVal = (i / N) * duration;
            const yVal = getWaveVal(wave, tVal);
            const px = marginL + (tVal / duration) * plotW;
            const py = centerY - (yVal / maxRangeY) * (plotH / 2);

            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.setLineDash([]);
        });

        // Draw Bold Composite Sum Wave
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 2.8 * window.devicePixelRatio;
        ctx.beginPath();

        for (let i = 0; i < N; i++) {
          const tVal = (i / N) * duration;
          let ySum = 0;
          activeLoadedWaves.forEach(w => {
            ySum += getWaveVal(w, tVal);
          });
          const px = marginL + (tVal / duration) * plotW;
          const py = centerY - (ySum / maxRangeY) * (plotH / 2);

          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        const combinedCompNames = activeLoadedWaves.map(w => w.name).join(', ');
        legendTime.innerHTML = `
          <div class="legend-item">
            <div class="legend-color" style="background:#f8fafc;"></div>
            <span>합성 파형 (${combinedCompNames})</span>
          </div>
        `;
        activeLoadedWaves.forEach(w => {
          legendTime.innerHTML += `
            <div class="legend-item">
              <div class="legend-color" style="background:${w.color};"></div>
              <span>${w.name} 성분</span>
            </div>
          `;
        });
      }

      // Draw Discrete Sample Overlay if Sampling is Active
      if (isSamplingActive && currentSampledData && currentSampledData.times.length > 0) {
        const times = currentSampledData.times;
        const vals = currentSampledData.values;

        // 1. Draw Thin Dashed Line connecting sample dots
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 1.5 * window.devicePixelRatio;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();

        for (let k = 0; k < times.length; k++) {
          const tVal = times[k];
          const yVal = vals[k];
          const px = marginL + (tVal / duration) * plotW;
          const py = centerY - (yVal / maxRangeY) * (plotH / 2);

          if (k === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.setLineDash([]);

        // 2. Draw Solid Circle Dots at sample points
        for (let k = 0; k < times.length; k++) {
          const tVal = times[k];
          const yVal = vals[k];
          const px = marginL + (tVal / duration) * plotW;
          const py = centerY - (yVal / maxRangeY) * (plotH / 2);

          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(px, py, 4.5 * window.devicePixelRatio, 0, 2 * Math.PI);
          ctx.fill();

          ctx.strokeStyle = '#0b1120';
          ctx.lineWidth = 1.5 * window.devicePixelRatio;
          ctx.stroke();
        }

        // Legend for discrete sampling
        legendTime.innerHTML += `
          <div class="legend-item">
            <div class="legend-color" style="background:#facc15;"></div>
            <span>디지털 샘플 점 (fs=${currentSampledData.fs.toFixed(1)}Hz, Δt=${currentSampledData.dt.toFixed(3)}s, N=${times.length}개)</span>
          </div>
        `;
      }
    }

    function drawFFTDomain() {
      const w = canvasFFT.width;
      const h = canvasFFT.height;
      const ctx = ctxFFT;

      ctx.clearRect(0, 0, w, h);

      const marginL = 55 * window.devicePixelRatio;
      const marginR = 30 * window.devicePixelRatio;
      const marginT = 30 * window.devicePixelRatio;
      const marginB = 45 * window.devicePixelRatio;

      const plotW = w - marginL - marginR;
      const plotH = h - marginT - marginB;

      // Axis Box
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1 * window.devicePixelRatio;
      ctx.strokeRect(marginL, marginT, plotW, plotH);

      const maxFreqView = 15.0; // 0 ~ 15 Hz view
      const maxAmpView = 5.0;   // 0 ~ 5.0 Spectral amplitude (matches max amplitude A=5.0)

      // X-axis ticks (0 ~ 15 Hz)
      ctx.fillStyle = '#94a3b8';
      ctx.font = `${11 * window.devicePixelRatio}px Inter`;
      ctx.textAlign = 'center';

      for (let freq = 0; freq <= 15; freq += 3) {
        const px = marginL + (freq / maxFreqView) * plotW;
        ctx.beginPath();
        ctx.moveTo(px, marginT + plotH);
        ctx.lineTo(px, marginT + plotH + 5 * window.devicePixelRatio);
        ctx.stroke();
        ctx.fillText(`${freq}Hz`, px, marginT + plotH + 20 * window.devicePixelRatio);
      }

      // Y-axis ticks (0.0 ~ 5.0)
      ctx.textAlign = 'right';
      for (let ampVal = 0.0; ampVal <= 5.0; ampVal += 1.0) {
        const py = marginT + plotH - (ampVal / maxAmpView) * plotH;
        ctx.beginPath();
        ctx.moveTo(marginL - 5 * window.devicePixelRatio, py);
        ctx.lineTo(marginL, py);
        ctx.stroke();
        ctx.fillText(ampVal.toFixed(1), marginL - 8 * window.devicePixelRatio, py + 4 * window.devicePixelRatio);
      }

      ctx.fillText('Frequency (Hz)', w - marginR, marginT + plotH + 35 * window.devicePixelRatio);
      ctx.fillText('Spectral amplitude', marginL - 10 * window.devicePixelRatio, marginT - 12 * window.devicePixelRatio);

      legendFFT.innerHTML = '';

      if (!hasRunFFT) {
        ctx.fillStyle = '#64748b';
        ctx.font = `${13 * window.devicePixelRatio}px Inter`;
        ctx.textAlign = 'center';
        ctx.fillText('Analysis Pending: Click "FFT 분석 실행" button', marginL + plotW / 2, marginT + plotH / 2);
        return;
      }

      if (activeLoadedWaves.length === 0) {
        // FFT of Single Live Wave (or Live Sampled Wave)
        if (isSamplingActive && currentSampledData && currentSampledData.times.length > 0) {
          const fftRes = computeSampledFFT(currentSampledData.values, currentSampledData.fs);
          const freqs = fftRes.freqs;
          const amps = fftRes.amps;

          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 2.5 * window.devicePixelRatio;
          ctx.beginPath();

          for (let i = 0; i < freqs.length; i++) {
            const freqVal = freqs[i];
            if (freqVal > maxFreqView) break;

            const px = marginL + (freqVal / maxFreqView) * plotW;
            const py = marginT + plotH - (amps[i] / maxAmpView) * plotH;

            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();

          legendFFT.innerHTML = `
            <div class="legend-item">
              <div class="legend-color" style="background:#facc15;"></div>
              <span>샘플 파형 FFT 스펙트럼 (fs=${currentSampledData.fs.toFixed(1)}Hz, N=${currentSampledData.times.length}개)</span>
            </div>
          `;
        } else {
          const A = parseFloat(sliderA.value);
          const f = parseFloat(sliderFreq.value);
          const phiRad = (parseFloat(sliderPhase.value) * Math.PI) / 180.0;
          const signalVals = new Float64Array(N);
          for (let i = 0; i < N; i++) {
            const tVal = (i / N) * duration;
            signalVals[i] = A * Math.sin(2 * Math.PI * f * tVal + phiRad);
          }

          const spectrum = runFFT(signalVals);

          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2.5 * window.devicePixelRatio;
          ctx.beginPath();

          const halfN = N / 2;
          for (let i = 0; i < halfN; i++) {
            const freqVal = (i / N) * fs;
            if (freqVal > maxFreqView) break;

            const px = marginL + (freqVal / maxFreqView) * plotW;
            const py = marginT + plotH - (spectrum[i] / maxAmpView) * plotH;

            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();

          legendFFT.innerHTML = `
            <div class="legend-item">
              <div class="legend-color" style="background:#38bdf8;"></div>
              <span>단일 파형 FFT 스펙트럼 (Peak at ${f.toFixed(2)}Hz, Amp=${A.toFixed(2)})</span>
            </div>
          `;
        }
      } else if (!isCombinedMode) {
        // Multi-wave Spectrum Overlay
        activeLoadedWaves.forEach(wave => {
          if (wave.isSampled && wave.sampleValues && wave.sampleValues.length > 0) {
            const fftRes = computeSampledFFT(wave.sampleValues, wave.fs);
            const freqs = fftRes.freqs;
            const amps = fftRes.amps;

            ctx.strokeStyle = wave.color;
            ctx.lineWidth = 2 * window.devicePixelRatio;
            ctx.beginPath();

            for (let i = 0; i < freqs.length; i++) {
              const freqVal = freqs[i];
              if (freqVal > maxFreqView) break;

              const px = marginL + (freqVal / maxFreqView) * plotW;
              const py = marginT + plotH - (amps[i] / maxAmpView) * plotH;

              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.stroke();
          } else {
            const signalVals = new Float64Array(N);
            for (let i = 0; i < N; i++) {
              const tVal = (i / N) * duration;
              signalVals[i] = getWaveVal(wave, tVal);
            }

            const spectrum = runFFT(signalVals);

            ctx.strokeStyle = wave.color;
            ctx.lineWidth = 2 * window.devicePixelRatio;
            ctx.beginPath();

            const halfN = N / 2;
            for (let i = 0; i < halfN; i++) {
              const freqVal = (i / N) * fs;
              if (freqVal > maxFreqView) break;

              const px = marginL + (freqVal / maxFreqView) * plotW;
              const py = marginT + plotH - (spectrum[i] / maxAmpView) * plotH;

              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.stroke();
          }

          const compStr = wave.componentNames ? wave.componentNames.join(', ') : (wave.components ? wave.components.map(c => `f=${c.f.toFixed(1)}Hz`).join(', ') : '');
          const legendText = wave.isSampled
            ? `${wave.name} FFT 스펙트럼 (fs=${wave.fs.toFixed(1)}Hz, Δt=${wave.dt.toFixed(3)}s)`
            : (wave.isComposite
              ? `${wave.name} FFT 스펙트럼 (${compStr})`
              : `${wave.name} (Peak: ${wave.f.toFixed(2)}Hz, Amp=${wave.A.toFixed(2)})`);

          legendFFT.innerHTML += `
            <div class="legend-item">
              <div class="legend-color" style="background:${wave.color};"></div>
              <span>${legendText}</span>
            </div>
          `;
        });
      } else {
        // Combined Sum Wave Spectrum
        const signalVals = new Float64Array(N);
        for (let i = 0; i < N; i++) {
          const tVal = (i / N) * duration;
          let ySum = 0;
          activeLoadedWaves.forEach(w => {
            ySum += getWaveVal(w, tVal);
          });
          signalVals[i] = ySum;
        }

        const spectrum = runFFT(signalVals);

        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 2.8 * window.devicePixelRatio;
        ctx.beginPath();

        const halfN = N / 2;
        for (let i = 0; i < halfN; i++) {
          const freqVal = (i / N) * fs;
          if (freqVal > maxFreqView) break;

          const px = marginL + (freqVal / maxFreqView) * plotW;
          const py = marginT + plotH - (spectrum[i] / maxAmpView) * plotH;

          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        const combinedCompNames = activeLoadedWaves.map(w => w.name).join(', ');
        legendFFT.innerHTML = `
          <div class="legend-item">
            <div class="legend-color" style="background:#f8fafc;"></div>
            <span>합성 파형 FFT 스펙트럼 (${combinedCompNames})</span>
          </div>
        `;
        activeLoadedWaves.forEach(w => {
          const infoText = w.isComposite
            ? `${w.name} 성분`
            : `${w.name} 피크 (${w.f.toFixed(2)}Hz)`;
          legendFFT.innerHTML += `
            <div class="legend-item">
              <div class="legend-color" style="background:${w.color};"></div>
              <span>${infoText}</span>
            </div>
          `;
        });
      }
    }

    // Initialize
    updateFormula();
    resizeCanvases();
  </script>
</body>
</html>
